description:
    en: |
        <h4>Monthly Climate Monitoring</h4>
        <p>
        Rainfall and temperature time series (from 1981) reconstructed from station observations and remote sensing proxies. 
        This interface allows users to view rainfall, maximum and minimum temperature climatologies and anomalies.
        </p>
    fr: |
        <h4>Suivi Climatique Mensuel</h4>
        <p>
        Séries temporelles (à partir de 1981) de précipitations et de température reconstruites à partir de données in-situ et de données de télédétection.
        Cette interface permet à l'utilisateur de visualiser les climatologies et les anomalies de précipitations et températures. Les climatologies sont définies par la période 1991-2020.
        </p>

dataset:
    use: MON
    variables:
        rain_mon: [precip]
        anom_mon: [precip]
        anom_per_mon: [precip]
        spi_mon: [precip]

variables:
    label:
        en: Variable
        fr: Variable
    select:
        rain_mon:
            en: Monthly Rainfall Total
            fr: Cumul de Précipitations Mensuelles
        anom_mon:
            en: Monthly Rainfall Anomaly
            fr: Anomalie de Précipitations Mensuelles
        anom_per_mon:
            en: Monthly Rainfall Anomaly in Percent
            fr: Anomalie de Précipitations Mensuelles en Pourcentage
        spi_mon:
            en: Standard Precipitation Index (SPI)
            fr: Indice de Précipitations Standardisé (SPI)

opt_dates:
    label:
        en: Date
        fr: Date
    month:
        en: Month of
        fr: Mois du
